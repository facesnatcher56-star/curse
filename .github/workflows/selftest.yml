name: Self-test

# Runs the game's built-in headless self-test (navigation, combat, hotkeys, skills, items...) on every push and PR.
on:
  push:
  pull_request:

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.8-dev2
  GODOT_ZIP: Godot_v4.8-dev2_linux.x86_64.zip

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # fetched below through a cache, so CI does not burn LFS bandwidth on every run

      - name: LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS files
        run: git lfs pull

      - name: Restore Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q ~/godot/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Restore asset import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('.lfs-assets-id', 'project.godot') }}

      - name: Import project
        run: ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --import

      - name: Run self-test
        run: |
          set +e
          timeout 1200 ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . res://game/main.tscn -- --selftest 2>&1 | tee selftest.log
          run_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$run_status" > selftest.exit-code
          python3 tools/ci_check_selftest.py selftest.log --exit-code "$run_status"

      - name: Run Item Test Lab suite
        run: |
          if timeout 120 ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . res://game/main.tscn -- --selftest --only=itemlab > itemlab.log 2>&1; then run_status=0; else run_status=$?; fi
          printf '%s\n' "$run_status" > itemlab.exit-code

      - name: Run equipment integration suites
        run: |
          mkdir -p suite-logs
          for name in powerdamage defensiveresistances dodgeblock popupclick itemlablayout itemlabdropdowns equipmentintegration ds2items items inventoryequip lootui equipmenthits equipmenteffects elements rangedmods ds2combat uiaudit movepriority uiblock camera knockdown; do
            log="suite-logs/$name.log"
            if timeout 300 ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . res://game/main.tscn -- --selftest --only=$name > "$log" 2>&1; then run_status=0; else run_status=$?; fi
            printf '%s\n' "$run_status" > "suite-logs/$name.exit-code"
          done

      - name: Python catalog and coverage validation
        run: |
          python3 tools/check_ds2_effect_coverage.py
          python3 tools/check_ds2_skill_suites.py
          python3 -m unittest discover -s tools -p "test_ds2_effect_coverage.py"
          python3 -m unittest discover -s tools -p "test_ds2_catalog.py"
          python3 -m unittest discover -s tools -p "test_ds2_skill_suites.py"
          python3 -m unittest discover -s tools -p "test_ci_check_selftest.py"

      - name: Check results
        if: always()
        run: |
          status=0
          if [[ ! -f selftest.log || ! -f selftest.exit-code ]]; then
            echo "missing full self-test log or exit status"
            status=1
          else
            read -r run_status < selftest.exit-code
            python3 tools/ci_check_selftest.py selftest.log --exit-code "$run_status" || status=1
          fi
          if [[ ! -f itemlab.log || ! -f itemlab.exit-code ]]; then
            echo "missing Item Lab log or exit status"
            status=1
          else
            read -r run_status < itemlab.exit-code
            python3 tools/ci_check_selftest.py itemlab.log --exit-code "$run_status" --expected-suite itemlab || status=1
          fi
          for name in powerdamage defensiveresistances dodgeblock popupclick itemlablayout itemlabdropdowns equipmentintegration ds2items items inventoryequip lootui equipmenthits equipmenteffects elements rangedmods ds2combat uiaudit movepriority uiblock camera knockdown; do
            log="suite-logs/$name.log"
            exit_file="suite-logs/$name.exit-code"
            echo "== $name"
            if [[ ! -f "$log" || ! -f "$exit_file" ]]; then
              echo "missing focused-suite log or exit status for $name"
              status=1
              continue
            fi
            read -r run_status < "$exit_file"
            python3 tools/ci_check_selftest.py "$log" --exit-code "$run_status" --expected-suite "$name" || status=1
          done
          exit $status

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: |
            selftest.log
            selftest.exit-code
            itemlab.log
            itemlab.exit-code
            suite-logs/*.log
            suite-logs/*.exit-code
